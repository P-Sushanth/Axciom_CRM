<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AcxiomCRM - Lead Management</title>
</head>
<body style="font-family: sans-serif; margin: 20px;">
  <div id="navbar"></div>

  <h2>Lead Management</h2>
  <hr>

  <div id="page-alert" style="display:none;"></div>

  <div style="display: flex; gap: 30px;">
    <div style="border: 1px solid #ccc; padding: 20px; width: 320px; height: fit-content;">
      <h3 id="form-title">Create New Lead</h3>
      <div id="lead-form-alert" style="display:none;"></div>
      <form id="lead-form" onsubmit="saveLead(event)">
        <input type="hidden" id="lead-id">
        <p>
          <label>Lead Name *:</label><br>
          <input type="text" id="lead-name" style="width: 100%;">
        </p>
        <p>
          <label>Email *:</label><br>
          <input type="text" id="lead-email" style="width: 100%;">
        </p>
        <p>
          <label>Phone * (10 digits):</label><br>
          <input type="text" id="lead-phone" style="width: 100%;">
        </p>
        <p>
          <label>Source:</label><br>
          <select id="lead-source" style="width: 100%;">
            <option value="Web Site">Web Site</option>
            <option value="Referral">Referral</option>
            <option value="Cold Call">Cold Call</option>
            <option value="Trade Show">Trade Show</option>
          </select>
        </p>
        <p>
          <label>Status:</label><br>
          <select id="lead-status" style="width: 100%;">
            <option value="New">New</option>
            <option value="Contacted">Contacted</option>
            <option value="Qualified">Qualified</option>
            <option value="Unqualified">Unqualified</option>
            <option value="Converted">Converted</option>
            <option value="Lost">Lost</option>
          </select>
        </p>
        <p>
          <label>Priority:</label><br>
          <select id="lead-priority" style="width: 100%;">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </p>
        <p>
          <label>Notes:</label><br>
          <textarea id="lead-notes" rows="2" style="width: 100%;"></textarea>
        </p>
        <button type="submit" id="save-btn">Save Lead</button>
        <button type="button" onclick="resetForm()">Cancel</button>
      </form>
    </div>

    <div style="flex-grow: 1;">
      <h3>Lead List</h3>
      <table border="1" cellpadding="6" cellspacing="0" style="width: 100%; border-collapse: collapse;">
        <thead>
          <tr style="background: #e0e0e0;">
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Source</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Owner</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="lead-tbody">
          <tr><td colspan="9">Loading leads...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const phoneRegex = /^\d{10}$/;

    document.addEventListener('DOMContentLoaded', async () => {
      await checkSession();
      loadLeads();
    });

    async function loadLeads() {
      try {
        const res = await fetch('/api/leads');
        if (!res.ok) return;
        const leads = await res.json();

        const tbody = document.getElementById('lead-tbody');
        if (leads.length === 0) {
          tbody.innerHTML = '<tr><td colspan="9">No leads found.</td></tr>';
          return;
        }

        tbody.innerHTML = leads.map(l => `
          <tr>
            <td>${l.id}</td>
            <td><strong>${escapeHtml(l.name)}</strong></td>
            <td>${escapeHtml(l.email)}</td>
            <td>${escapeHtml(l.phone)}</td>
            <td>${escapeHtml(l.source)}</td>
            <td>${escapeHtml(l.status)}</td>
            <td>${escapeHtml(l.priority)}</td>
            <td>${escapeHtml(l.owner_name || 'N/A')}</td>
            <td>
              <button onclick="editLead(${l.id})">Edit</button>
              ${l.status !== 'Converted' ? `<button onclick="convertLead(${l.id})">Convert</button>` : '<span style="color:green;">(Converted)</span>'}
              <button onclick="deleteLead(${l.id})">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {}
    }

    function validateLeadForm() {
      clearAlert('lead-form-alert');
      const name = document.getElementById('lead-name').value.trim();
      const email = document.getElementById('lead-email').value.trim();
      const phone = document.getElementById('lead-phone').value.trim();

      if (!name) {
        showAlert('lead-form-alert', 'Lead Name is required.', true);
        return false;
      }

      if (!email || !emailRegex.test(email)) {
        showAlert('lead-form-alert', 'Enter a valid email address.', true);
        return false;
      }

      if (!phone || !phoneRegex.test(phone)) {
        showAlert('lead-form-alert', 'Enter a valid 10-digit phone number.', true);
        return false;
      }

      return true;
    }

    async function saveLead(e) {
      e.preventDefault();
      if (!validateLeadForm()) return;

      const id = document.getElementById('lead-id').value;
      const payload = {
        name: document.getElementById('lead-name').value.trim(),
        email: document.getElementById('lead-email').value.trim(),
        phone: document.getElementById('lead-phone').value.trim(),
        source: document.getElementById('lead-source').value,
        status: document.getElementById('lead-status').value,
        priority: document.getElementById('lead-priority').value,
        notes: document.getElementById('lead-notes').value.trim()
      };

      const url = id ? `/api/leads/${id}` : '/api/leads';
      const method = id ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          showAlert('lead-form-alert', data.error || 'Failed to save lead', true);
        } else {
          showAlert('page-alert', data.message, false);
          resetForm();
          loadLeads();
        }
      } catch (err) {
        showAlert('lead-form-alert', 'Error saving lead', true);
      }
    }

    async function convertLead(id) {
      if (!confirm('Convert this lead into a Customer?')) return;
      clearAlert('page-alert');

      const res = await fetch(`/api/leads/${id}/convert`, { method: 'POST' });
      const data = await res.json();

      if (!res.ok) {
        showAlert('page-alert', data.error || 'Conversion failed', true);
      } else {
        showAlert('page-alert', data.message, false);
        loadLeads();
      }
    }

    async function editLead(id) {
      clearAlert('lead-form-alert');
      const res = await fetch('/api/leads');
      if (!res.ok) return;
      const leads = await res.json();
      const l = leads.find(x => x.id === id);
      if (!l) return;

      document.getElementById('lead-id').value = l.id;
      document.getElementById('lead-name').value = l.name;
      document.getElementById('lead-email').value = l.email;
      document.getElementById('lead-phone').value = l.phone;
      document.getElementById('lead-source').value = l.source || 'Web Site';
      document.getElementById('lead-status').value = l.status || 'New';
      document.getElementById('lead-priority').value = l.priority || 'Medium';
      document.getElementById('lead-notes').value = l.notes || '';

      document.getElementById('form-title').innerText = `Edit Lead #${l.id}`;
      document.getElementById('save-btn').innerText = 'Update Lead';
    }

    async function deleteLead(id) {
      if (!confirm('Delete lead?')) return;
      const res = await fetch(`/api/leads/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) {
        showAlert('page-alert', data.error, true);
      } else {
        showAlert('page-alert', data.message, false);
        loadLeads();
      }
    }

    function resetForm() {
      document.getElementById('lead-form').reset();
      document.getElementById('lead-id').value = '';
      document.getElementById('form-title').innerText = 'Create New Lead';
      document.getElementById('save-btn').innerText = 'Save Lead';
      clearAlert('lead-form-alert');
    }
  </script>
</body>
</html>
